name: Build BernAPlan Setup Studio

on:
  push:
    branches:
      - main
    paths:
      - 'prototype/index.html'
      - 'setup-studio/**'
      - '.github/workflows/build-setup-studio.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bernaplan-setup-studio-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-publish:
    runs-on: windows-latest
    steps:
      - name: Check out BernAPlan
        uses: actions/checkout@v4

      - name: Package browser-based Setup Studio and BernAPlan 2.0
        shell: pwsh
        run: |
          $stage = Join-Path $env:RUNNER_TEMP 'BernAPlan_Setup_Studio_v2.0.0'
          if (Test-Path $stage) { Remove-Item $stage -Recurse -Force }
          New-Item -ItemType Directory -Path $stage -Force | Out-Null
          Copy-Item -LiteralPath 'setup-studio\setup.html' -Destination (Join-Path $stage 'setup.html') -Force
          Copy-Item -LiteralPath 'setup-studio\README-Setup-Studio.txt' -Destination (Join-Path $stage 'README-Setup-Studio.txt') -Force
          New-Item -ItemType Directory -Path (Join-Path $stage 'BernAPlan') -Force | Out-Null
          Copy-Item -LiteralPath 'prototype\index.html' -Destination (Join-Path $stage 'BernAPlan\index.html') -Force
          $zipPath = Join-Path $env:GITHUB_WORKSPACE 'BernAPlan_Setup_Studio_v2.0.0.zip'
          if (Test-Path $zipPath) { Remove-Item $zipPath -Force }
          Compress-Archive -Path (Join-Path $stage '*') -DestinationPath $zipPath -CompressionLevel Optimal
          if (-not (Test-Path $zipPath)) { throw 'Setup Studio ZIP was not created.' }

      - name: Publish the beta download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.0.0-beta
          name: BernAPlan Setup Studio v2.0.0 Beta
          target_commitish: main
          prerelease: true
          make_latest: false
          fail_on_unmatched_files: true
          body: |
            Browser-based Setup Studio for the new BernAPlan 2.0 Desktop Command Center.

            Open setup.html from the extracted ZIP. It launches the bundled planner and provides the latest planner HTML for manual installation or updates. The ZIP contains no PowerShell or CMD launcher, so users do not need to run a custom Windows installer or disable Windows security.

            Planner data is stored in browser local storage. Export a JSON backup before replacing the app or moving to another computer.
          files: BernAPlan_Setup_Studio_v2.0.0.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
